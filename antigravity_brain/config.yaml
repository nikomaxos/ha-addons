name: "Antigravity Brain"
description: "Smart Voice Assistant Brain powered by Codex, Antigravity, and Gemini with two-phase response"
version: "3.3.2"
slug: "antigravity_brain"
init: true
arch:
  - aarch64
  - amd64
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8000
ingress_panel: true
panel_icon: mdi:brain
panel_title: "Antigravity Brain"
webui: "http://[HOST]:[PORT:8000]"
map:
  - homeassistant_config:rw
  - share:rw
options:
  api_port: 8000

  # Phase 1: Fast Agent (Instant Voice Responses)
  fast_agent_engine: "gemini_api"
  fast_agent_model: "gemini-3.8-flash"
  fast_agent_thinking: "low"
  fast_agent_api_key: ""

  # Phase 2: Heavy Agent (Background Deep Research)
  heavy_agent_engine: "codex_fallback"
  heavy_agent_model: "auto"
  heavy_agent_thinking: "high"

  # TTS Engine & Voice Configuration
  tts_engine: "tts.google_cloud"
  tts_voice: "el-GR-Chirp3-HD-Laomedeia"

  # Re-authentication controls (toggle ON and click Save to trigger new auth flow)
  reauth_codex: false
  reauth_antigravity: false
schema:
  api_port: int

  fast_agent_engine: list(gemini_api|openai_api)
  fast_agent_model: list(gemini-3.8-flash|gemini-3.1-pro|gpt-4o-mini|gpt-4o)
  fast_agent_thinking: list(none|low|medium|high)
  fast_agent_api_key: password?

  heavy_agent_engine: list(codex_fallback|codex_only|antigravity_only|gemini_legacy)
  heavy_agent_model: list(auto|gpt-5|o3|gpt-4o|gemini-3.1-pro)
  heavy_agent_thinking: list(low|medium|high)

  tts_engine: list(tts.google_cloud|tts.edge_tts_2|tts.openai_tts_openai|tts.piper|tts.google_ai_tts)?
  tts_voice: list(el-GR-Chirp3-HD-Laomedeia|el-GR-NestorasNeural|el-GR-AthinaNeural|nova|alloy|kore|laomedeia|el_GR-rapunzelina-medium)?

  reauth_codex: bool?
  reauth_antigravity: bool?
ports:
  8000/tcp: 8000
