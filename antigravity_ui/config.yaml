name: "Antigravity UI"
description: "Google Antigravity Web Interface with Full System Access"
version: "1.1.5"
slug: "antigravity_ui"
init: false
arch:
  - aarch64
  - amd64
  - armv7
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Web UI Port (Direct Access)"
webui: "http://[HOST]:[PORT:8080]"
host_network: true
host_dbus: true
hassio_api: true
homeassistant_api: true
map:
  - config:rw
  - share:rw
  - addons:rw
  - backup:rw
  - media:rw
  - ssl:rw
options:
  web_password: ""
schema:
  web_password: str?
startup: application
